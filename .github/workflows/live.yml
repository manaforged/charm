name: live

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  live:
    name: live (${{ matrix.os }})
    if: github.repository == 'manaforged/charm'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: live
          workspaces: ". -> target/verify"
          save-if: false

      - name: live test
        shell: bash
        env:
          CHROME_EXE: ${{ steps.chrome.outputs.chrome-path }}
          CHARM_CHROME_NO_SANDBOX: ${{ runner.os == 'Linux' && '1' || '' }}
        run: scripts/verify.sh --only live
