name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: charm-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: check
    uses: ./.github/workflows/check.yml

  live:
    name: live
    uses: ./.github/workflows/live.yml

  hygiene:
    name: hygiene
    uses: ./.github/workflows/hygiene.yml
    secrets: inherit

  package:
    name: package
    needs: [check, live, hygiene]
    if: github.repository == 'manaforged/charm' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: qualify and package
        run: scripts/verify.sh --only release,package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            target/verify/package/*.crate
            target/verify/release-notes.md
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish
    needs: package
    if: github.repository == 'manaforged/charm' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
      url: https://crates.io/crates/charm-cdp
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: scripts/verify.sh --only publish

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/package/*.crate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file dist/release-notes.md
          ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
          dist/package/*.crate
